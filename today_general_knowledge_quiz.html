<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 상식 | 랜덤 퀴즈</title>
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#172033; --muted:#6b7280;
  --primary:#5368e8; --primary-dark:#4053c8; --border:#e5e9f2;
  --green:#15966a; --green-bg:#e9f8f1; --red:#d94b55; --red-bg:#fff0f1;
  --shadow:0 18px 50px rgba(29,45,88,.09);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#e8edff 0,transparent 34%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
.app{width:min(920px,calc(100% - 32px));margin:0 auto;padding:34px 0 48px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#6175f5,#8a5de8);display:grid;place-items:center;color:white;font-size:25px;box-shadow:0 8px 20px #6575e844}
.brand h1{font-size:22px;margin:0;letter-spacing:-.5px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.pill{border:1px solid var(--border);background:#fff;padding:9px 13px;border-radius:999px;color:#596276;font-size:13px;font-weight:700}
.main{display:grid;grid-template-columns:1fr;gap:18px}
.card{background:var(--card);border:1px solid #edf0f6;border-radius:24px;box-shadow:var(--shadow);padding:clamp(20px,4vw,34px)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.category{display:inline-flex;align-items:center;gap:7px;background:#eef1ff;color:#485bd2;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}
.count{font-size:13px;color:var(--muted);font-weight:700}
.progress{height:8px;background:#edf0f6;border-radius:999px;overflow:hidden;margin-bottom:26px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#6377f6,#8b61e8);border-radius:999px;transition:width .35s}
.question{font-size:clamp(21px,4vw,30px);font-weight:800;line-height:1.5;letter-spacing:-.7px;margin:0 0 24px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:64px;text-align:left;border:1.5px solid var(--border);border-radius:16px;background:#fff;padding:15px 17px;display:flex;align-items:center;gap:12px;color:var(--ink);transition:.18s}
.answer:hover:not(:disabled){border-color:#8795f6;background:#f8f9ff;transform:translateY(-2px)}
.answer .letter{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#f0f2f8;display:grid;place-items:center;font-size:13px;font-weight:800;color:#626b80}
.answer .text{font-weight:650;line-height:1.45}
.answer.correct{border-color:var(--green);background:var(--green-bg);color:#08784f}
.answer.correct .letter{background:var(--green);color:white}
.answer.wrong{border-color:var(--red);background:var(--red-bg);color:#b82f3b}
.answer.wrong .letter{background:var(--red);color:white}
.answer:disabled{cursor:default}
.feedback{display:none;margin-top:18px;border-radius:16px;padding:17px 18px;line-height:1.65}
.feedback.show{display:block;animation:fadeIn .25s ease}
.feedback.good{background:var(--green-bg);color:#086f4c}
.feedback.bad{background:var(--red-bg);color:#a72d37}
.feedback strong{display:block;font-size:16px;margin-bottom:4px}
.feedback .explanation{font-size:14px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;transition:.18s}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 7px 18px #5368e833}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-secondary{background:#f0f2f8;color:#596276}
.btn-secondary:hover{background:#e7eaf2}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.stat{background:#f8f9fc;border:1px solid #edf0f6;border-radius:16px;padding:15px;text-align:center}
.stat .label{color:var(--muted);font-size:12px;font-weight:700}
.stat .value{font-size:23px;font-weight:850;margin-top:4px}
.result{display:none;text-align:center}
.result.show{display:block;animation:fadeIn .3s ease}
.result-icon{font-size:60px;margin:4px 0 10px}
.result h2{font-size:28px;margin:0 0 8px}
.result p{color:var(--muted);margin:0 0 22px}
.result-score{font-size:48px;font-weight:900;color:var(--primary);letter-spacing:-2px;margin:10px 0}
.result-stats{max-width:520px;margin:22px auto}
.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.footer{text-align:center;color:#9aa2b3;font-size:12px;margin-top:20px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
 .app{padding:20px 0 32px}
 .header{align-items:flex-start}
 .brand h1{font-size:20px}
 .pill{font-size:11px;padding:8px 10px}
 .answers{grid-template-columns:1fr;gap:10px}
 .answer{min-height:58px}
 .actions{align-items:stretch}
 .actions .btn{flex:1}
 .stats{gap:8px}
 .stat{padding:12px 7px}
 .stat .value{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">🧠</div>
      <div><h1>오늘의 상식</h1><p>매일 하나씩, 세상을 더 알아가기</p></div>
    </div>
    <div class="pill">✨ 랜덤 퀴즈</div>
  </header>

  <main class="main">
    <section class="card" id="quizCard">
      <div class="topline">
        <span class="category" id="category">🌍 상식</span>
        <span class="count" id="count">문제 1 / 15</span>
      </div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <h2 class="question" id="question">문제가 표시됩니다.</h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-secondary" id="restartBtn">처음부터</button>
        <button class="btn btn-primary" id="nextBtn" disabled>다음 문제 →</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">맞힌 문제</div><div class="value" id="correctStat">0</div></div>
        <div class="stat"><div class="label">풀이 완료</div><div class="value" id="solvedStat">0</div></div>
        <div class="stat"><div class="label">현재 정답률</div><div class="value" id="rateStat">0%</div></div>
      </div>
    </section>

    <section class="card result" id="resultCard">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle">퀴즈 완료!</h2>
      <p id="resultMessage">오늘의 상식 도전을 마쳤습니다.</p>
      <div class="result-score" id="resultScore">0 / 15</div>
      <div class="stats result-stats">
        <div class="stat"><div class="label">정답</div><div class="value" id="finalCorrect">0</div></div>
        <div class="stat"><div class="label">오답</div><div class="value" id="finalWrong">0</div></div>
        <div class="stat"><div class="label">정답률</div><div class="value" id="finalRate">0%</div></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" id="playAgainBtn">🔄 다시 도전하기</button>
      </div>
    </section>
  </main>
  <div class="footer">오늘의 상식 · 지식을 쌓는 작은 습관</div>
</div>

<script>
const questionBank = [
 {category:"과학",q:"빛이 1년 동안 진공에서 이동하는 거리를 무엇이라고 할까요?",options:["천문단위","광년","파섹","광초"],answer:1,explanation:"광년은 시간 단위가 아니라 거리 단위예요. 빛이 1년 동안 이동하는 거리로 약 9조 4600억 km입니다."},
 {category:"역사",q:"대한민국의 광복절은 몇 월 며칠일까요?",options:["3월 1일","6월 6일","8월 15일","10월 3일"],answer:2,explanation:"1945년 8월 15일 일본의 항복으로 한국이 광복을 맞았으며, 1948년 정부 수립도 이날 기념합니다."},
 {category:"지리",q:"세계에서 면적이 가장 넓은 국가는 어디일까요?",options:["캐나다","중국","미국","러시아"],answer:3,explanation:"러시아는 유럽과 아시아에 걸쳐 있으며 세계에서 가장 넓은 국토를 가진 국가입니다."},
 {category:"과학",q:"물의 화학식은 무엇일까요?",options:["CO₂","H₂O","O₂","NaCl"],answer:1,explanation:"물 한 분자는 수소 원자 2개와 산소 원자 1개로 이루어져 있어 H₂O로 나타냅니다."},
 {category:"경제",q:"물건과 서비스의 전반적인 가격 수준이 지속적으로 오르는 현상은?",options:["디플레이션","경기침체","인플레이션","환율하락"],answer:2,explanation:"인플레이션은 전반적인 물가가 지속적으로 상승해 돈의 구매력이 낮아지는 현상입니다."},
 {category:"문화",q:"셰익스피어의 작품 중 햄릿이 등장하는 작품은?",options:["맥베스","오셀로","리어왕","햄릿"],answer:3,explanation:"햄릿은 덴마크 왕자 햄릿이 아버지의 죽음과 복수를 둘러싸고 고뇌하는 비극입니다."},
 {category:"스포츠",q:"축구 경기에서 한 팀이 경기장에 동시에 출전하는 선수는 몇 명일까요?",options:["9명","10명","11명","12명"],answer:2,explanation:"축구는 골키퍼 1명을 포함해 한 팀 11명이 경기장에 출전합니다."},
 {category:"과학",q:"태양계에서 가장 큰 행성은 무엇일까요?",options:["토성","목성","해왕성","지구"],answer:1,explanation:"목성은 태양계에서 가장 큰 행성으로, 지구보다 지름이 약 11배 큽니다."},
 {category:"역사",q:"한글을 창제한 조선의 왕은 누구일까요?",options:["태조","세종대왕","정조","문종"],answer:1,explanation:"세종대왕은 백성이 쉽게 글을 익힐 수 있도록 훈민정음을 창제했고 1446년에 반포했습니다."},
 {category:"지리",q:"세계에서 가장 높은 산은 무엇일까요?",options:["K2","킬리만자로","에베레스트","몽블랑"],answer:2,explanation:"에베레스트산은 해발 약 8,849m로 히말라야산맥에 위치한 세계 최고봉입니다."},
 {category:"과학",q:"성인의 몸에서 일반적으로 가장 큰 기관은 무엇일까요?",options:["간","폐","피부","심장"],answer:2,explanation:"피부는 몸의 바깥을 덮는 기관으로 면적과 무게 기준에서 가장 큰 기관입니다."},
 {category:"경제",q:"주식회사가 투자자에게 회사 소유권의 일부를 나타내어 발행하는 것은?",options:["채권","주식","예금","보험"],answer:1,explanation:"주식은 주주가 회사의 지분을 보유하고 있음을 나타내는 증권입니다."},
 {category:"문화",q:"프랑스의 수도는 어디일까요?",options:["마드리드","로마","파리","베를린"],answer:2,explanation:"파리는 프랑스의 수도이며 센강을 중심으로 발달한 도시입니다."},
 {category:"스포츠",q:"올림픽 오륜기의 고리는 몇 개일까요?",options:["4개","5개","6개","7개"],answer:1,explanation:"오륜기는 다섯 대륙의 단결을 상징하는 다섯 개의 고리로 이루어져 있습니다."},
 {category:"과학",q:"식물이 광합성을 할 때 주로 흡수하는 기체는 무엇일까요?",options:["산소","질소","이산화탄소","수소"],answer:2,explanation:"식물은 빛 에너지를 이용해 이산화탄소와 물로 유기물을 만들고 산소를 방출합니다."},
 {category:"역사",q:"고대 이집트에서 왕을 일컫던 명칭은 무엇일까요?",options:["황제","술탄","파라오","카이사르"],answer:2,explanation:"파라오는 고대 이집트의 왕을 가리키는 명칭으로, 종교적 권위도 함께 지녔습니다."},
 {category:"지리",q:"일본의 가장 큰 섬은 무엇일까요?",options:["홋카이도","규슈","시코쿠","혼슈"],answer:3,explanation:"혼슈는 일본의 주요 4개 섬 중 가장 크며 도쿄, 오사카 등 주요 도시가 위치합니다."},
 {category:"과학",q:"소리의 전달이 어려운 곳은 어디일까요?",options:["물속","공기 중","철 속","진공"],answer:3,explanation:"소리는 매질의 진동을 통해 전달되므로 입자가 없는 진공에서는 전달되지 않습니다."},
 {category:"경제",q:"은행에서 돈을 빌리고 그 대가로 지급하는 비용을 무엇이라고 할까요?",options:["세금","이자","배당","수수료"],answer:1,explanation:"이자는 돈을 빌려 사용한 대가로 원금에 추가해 지급하는 금액입니다."},
 {category:"문화",q:"세계적으로 유명한 모나리자를 그린 화가는 누구일까요?",options:["빈센트 반 고흐","파블로 피카소","레오나르도 다 빈치","클로드 모네"],answer:2,explanation:"모나리자는 르네상스 시대 예술가 레오나르도 다 빈치의 대표작입니다."},
 {category:"스포츠",q:"테니스에서 점수가 0점을 뜻하는 표현은 무엇일까요?",options:["러브","제로","널","블랭크"],answer:0,explanation:"테니스에서는 0점을 '러브(love)'라고 부르는 독특한 점수 표현을 사용합니다."},
 {category:"과학",q:"지구의 자연 위성은 무엇일까요?",options:["화성","달","태양","금성"],answer:1,explanation:"달은 지구를 공전하는 자연 위성이며 지구에서 가장 가까운 천체입니다."},
 {category:"역사",q:"고려를 세운 인물은 누구일까요?",options:["이성계","왕건","궁예","견훤"],answer:1,explanation:"왕건은 918년에 고려를 세우고 936년에 후삼국을 통일했습니다."},
 {category:"지리",q:"적도는 지구를 어떤 두 부분으로 나누는 기준선일까요?",options:["동반구와 서반구","남반구와 북반구","대륙과 해양","열대와 온대"],answer:1,explanation:"적도는 위도 0도에 해당하며 지구를 북반구와 남반구로 나누는 가상의 선입니다."},
 {category:"과학",q:"인체에서 혈액을 온몸으로 보내는 역할을 하는 기관은?",options:["위","간","심장","췌장"],answer:2,explanation:"심장은 수축과 이완을 반복하며 혈액을 폐와 온몸으로 순환시키는 펌프 역할을 합니다."},
 {category:"경제",q:"국가 간 상품이나 서비스의 거래를 무엇이라고 할까요?",options:["내수","무역","투자","저축"],answer:1,explanation:"무역은 국가 또는 경제권 사이에서 상품과 서비스를 사고파는 활동입니다."},
 {category:"문화",q:"피아노의 건반은 일반적으로 어떤 두 색으로 이루어져 있을까요?",options:["빨강과 파랑","검정과 흰색","노랑과 검정","초록과 흰색"],answer:1,explanation:"피아노 건반은 흰 건반과 검은 건반으로 이루어져 음계를 표현합니다."},
 {category:"스포츠",q:"마라톤의 공식 거리로 가장 가까운 것은?",options:["21.1km","30km","42.195km","50km"],answer:2,explanation:"마라톤의 공식 거리는 42.195km입니다."},
 {category:"과학",q:"전류의 단위는 무엇일까요?",options:["볼트","와트","암페어","옴"],answer:2,explanation:"암페어(A)는 전류의 세기를 나타내는 SI 단위입니다."},
 {category:"역사",q:"대한민국의 국보 1호로 지정되었던 건축물은 무엇일까요?",options:["경복궁","숭례문","첨성대","불국사"],answer:1,explanation:"숭례문은 서울의 대표적인 성문으로 오랫동안 국보 1호였으며, 현재 국보 지정번호 체계는 폐지되었습니다."},
 {category:"지리",q:"세계에서 인구가 가장 많은 국가로 현재 널리 알려진 곳은?",options:["미국","인도","중국","인도네시아"],answer:1,explanation:"인도는 2023년경 중국을 넘어 세계에서 인구가 가장 많은 국가가 된 것으로 추정됩니다."},
 {category:"과학",q:"DNA의 기본적인 구조를 설명하는 표현은 무엇일까요?",options:["단일 원형","이중 나선","삼중 막","직선 사슬"],answer:1,explanation:"DNA는 일반적으로 두 가닥이 서로 꼬인 이중 나선 구조를 가집니다."},

const TOTAL = 15;
let questions = [];
let current = 0;
let correct = 0;
let solved = 0;
let answered = false;

const $ = id => document.getElementById(id);
const letters = ["A","B","C","D"];

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function startQuiz(){
  questions = shuffle([...questionBank]).slice(0,TOTAL);
  current=0;correct=0;solved=0;answered=false;
  $("quizCard").style.display="block";
  $("resultCard").classList.remove("show");
  renderQuestion();
}
function renderQuestion(){
  const item=questions[current];
  $("category").textContent=categoryEmoji(item.category)+" "+item.category;
  $("count").textContent=`문제 ${current+1} / ${questions.length}`;
  $("progressBar").style.width=`${(current/questions.length)*100}%`;
  $("question").textContent=item.q;
  $("answers").innerHTML="";
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  $("nextBtn").disabled=true;
  answered=false;
  item.options.forEach((option,index)=>{
    const btn=document.createElement("button");
    btn.className="answer";
    btn.innerHTML=`<span class="letter">${letters[index]}</span><span class="text"></span>`;
    btn.querySelector(".text").textContent=option;
    btn.addEventListener("click",()=>selectAnswer(index));
    $("answers").appendChild(btn);
  });
  updateStats();
}
function categoryEmoji(category){
  const map={과학:"🔬",역사:"🏛️",지리:"🌍",경제:"💰",문화:"🎨",스포츠:"⚽"};
  return map[category]||"💡";
}
function selectAnswer(index){
  if(answered)return;
  answered=true;solved++;
  const item=questions[current];
  const buttons=[...$("answers").querySelectorAll(".answer")];
  buttons.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===item.answer)btn.classList.add("correct");
    if(i===index&&i!==item.answer)btn.classList.add("wrong");
  });
  const isCorrect=index===item.answer;
  if(isCorrect)correct++;
  const feedback=$("feedback");
  feedback.className=`feedback show ${isCorrect?"good":"bad"}`;
  feedback.innerHTML=`<strong>${isCorrect?"🎉 정답입니다!":"❌ 아쉽지만 오답이에요."}</strong><div class="explanation"></div>`;
  feedback.querySelector(".explanation").textContent=`정답: ${item.options[item.answer]} · ${item.explanation}`;
  $("nextBtn").disabled=false;
  $("nextBtn").textContent=current===questions.length-1?"결과 보기 →":"다음 문제 →";
  $("progressBar").style.width=`${(solved/questions.length)*100}%`;
  updateStats();
}
function updateStats(){
  $("correctStat").textContent=correct;
  $("solvedStat").textContent=solved;
  $("rateStat").textContent=solved?`${Math.round(correct/solved*100)}%`:"0%";
}
function nextQuestion(){
  if(!answered)return;
  if(current<questions.length-1){
    current++;
    renderQuestion();
  }else showResult();
}
function showResult(){
  $("quizCard").style.display="none";
  $("resultCard").classList.add("show");
  const rate=Math.round(correct/questions.length*100);
  $("resultScore").textContent=`${correct} / ${questions.length}`;
  $("finalCorrect").textContent=correct;
  $("finalWrong").textContent=questions.length-correct;
  $("finalRate").textContent=`${rate}%`;
  let icon,title,message;
  if(rate>=90){icon="🏆";title="상식왕!";message="대단해요! 거의 모든 문제를 맞혔어요. 지식이 정말 풍부하네요!"}
  else if(rate>=70){icon="🧠";title="똑똑한 지식인!";message="훌륭한 결과예요! 조금만 더 공부하면 상식왕에 도전할 수 있겠어요."}
  else if(rate>=50){icon="🌱";title="성장 중인 상식인!";message="좋은 출발이에요. 오늘 새롭게 알게 된 지식을 기억해 보세요!"}
  else{icon="📚";title="다시 도전해 보세요!";message="틀린 문제의 해설을 읽어보면 다음 도전에서 더 좋은 결과를 얻을 수 있어요."}
  $("resultIcon").textContent=icon;
  $("resultTitle").textContent=title;
  $("resultMessage").textContent=message;
}
$("nextBtn").addEventListener("click",nextQuestion);
$("restartBtn").addEventListener("click",startQuiz);
$("playAgainBtn").addEventListener("click",startQuiz);
startQuiz();
</script>
